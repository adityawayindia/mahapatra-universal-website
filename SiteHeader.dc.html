<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;}
  a{text-decoration:none;}
</style>
</helmet>
<div style="position:fixed;top:0;left:0;right:0;z-index:1000;padding:clamp(12px,1.8vw,18px) clamp(16px,3vw,32px) 0;font-family:'Plus Jakarta Sans',sans-serif;">
  <div style="max-width:1320px;margin:0 auto;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(16,17,20,0.08);border-radius:100px;padding:10px 12px 10px clamp(20px,2.4vw,28px);display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(16,17,20,0.08), 0 2px 6px rgba(16,17,20,0.04);">
    <a href="index.dc.html" style="display:flex;align-items:center;gap:13px;flex-shrink:0;">
      <span style="display:flex;gap:4px;height:22px;align-items:center;">
        <span style="width:3.5px;height:22px;border-radius:2px;background:#16256B;"></span>
        <span style="width:3.5px;height:16px;border-radius:2px;background:#F27518;"></span>
        <span style="width:3.5px;height:22px;border-radius:2px;background:#8E1D1B;"></span>
      </span>
      <span style="display:flex;flex-direction:column;line-height:1;">
        <span style="color:#0F141E;font-weight:800;font-size:18px;letter-spacing:0.04em;">MAHAPATRA</span>
        <span style="color:rgba(15,20,30,0.5);font-weight:600;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;margin-top:3px;">Universal Limited</span>
      </span>
    </a>

    <nav style="{{ desktopNavStyle }}">
      <a href="about.dc.html" style="{{ navLinkStyle_about }}" style-hover="color:#0F141E;">About Us</a>

      <div style="position:relative;" onMouseEnter="{{ openBiz }}" onMouseLeave="{{ closeBiz }}">
        <a href="business.dc.html" style="{{ navLinkStyle_business }}display:flex;align-items:center;gap:7px;" style-hover="color:#0F141E;">
          Businesses
          <svg width="11" height="7" viewBox="0 0 11 7" fill="none" style="transform:{{ bizArrowRotate }};transition:transform 0.25s ease;opacity:0.75;">
            <path d="M1 1L5.5 5.5L10 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <div style="position:absolute;top:100%;left:0;right:0;height:20px;"></div>
        <div style="{{ bizDropdownStyle }}">
          <div style="padding:8px 14px 4px;font-size:11px;font-weight:700;letter-spacing:0.08em;color:#8E8A80;text-transform:uppercase;">Core Verticals</div>
          <a href="business.dc.html#engineering" style="{{ bizItemStyle }}" style-hover="background:#F5F3EF;color:#101114;">
            <span style="{{ bizDotStyle('#16256B') }}"></span>
            <div>
              <div style="font-weight:600;line-height:1.2;">Engineering</div>
              <div style="font-size:12px;color:#8E8A80;font-weight:400;margin-top:2px;">Infrastructure &amp; Industry</div>
            </div>
          </a>
          <a href="business.dc.html#technology" style="{{ bizItemStyle }}" style-hover="background:#F5F3EF;color:#101114;">
            <span style="{{ bizDotStyle('#F27518') }}"></span>
            <div>
              <div style="font-weight:600;line-height:1.2;">Information Technology</div>
              <div style="font-size:12px;color:#8E8A80;font-weight:400;margin-top:2px;">Data, Cloud &amp; Advisory</div>
            </div>
          </a>
          <a href="business.dc.html#hospitality" style="{{ bizItemStyle }}" style-hover="background:#F5F3EF;color:#101114;">
            <span style="{{ bizDotStyle('#8E1D1B') }}"></span>
            <div>
              <div style="font-weight:600;line-height:1.2;">Hospitality</div>
              <div style="font-size:12px;color:#8E8A80;font-weight:400;margin-top:2px;">Global Hotels &amp; Resorts</div>
            </div>
          </a>
        </div>
      </div>

      <a href="leadership.dc.html" style="{{ navLinkStyle_leadership }}" style-hover="color:#0F141E;">Leadership</a>
    </nav>

    <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
      <a href="contact.dc.html" style="{{ ctaDisplayStyle }}align-items:center;gap:8px;background:linear-gradient(180deg,#0F141E 0%,#1A2233 100%);color:#FFFFFF;font-weight:700;font-size:15px;letter-spacing:0.01em;padding:12px 26px;border-radius:100px;box-shadow:0 4px 16px rgba(15,20,30,0.18);transition:all 0.25s ease;" style-hover="background:#16256B;box-shadow:0 6px 22px rgba(22,37,107,0.3);transform:translateY(-1px);">
        Contact Us
      </a>
      <button onClick="{{ toggleMobile }}" aria-label="Menu" style="{{ hamburgerBtnStyle }}">
        <span style="{{ barStyle(1) }}"></span>
        <span style="{{ barStyle(2) }}"></span>
        <span style="{{ barStyle(3) }}"></span>
      </button>
    </div>
  </div>

  <div style="{{ mobilePanelStyle }}">
    <a href="about.dc.html" style="{{ mobileLinkStyle }}">About Us</a>
    <div>
      <div onClick="{{ toggleBizMobile }}" style="{{ mobileLinkStyle }}display:flex;align-items:center;justify-content:space-between;cursor:pointer;">
        Businesses
        <svg width="12" height="8" viewBox="0 0 11 7" fill="none" style="transform:{{ bizArrowRotateMobile }};transition:transform 0.25s ease;flex-shrink:0;"><path d="M1 1L5.5 5.5L10 1" stroke="#0F141E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="{{ bizMobilePanelStyle }}">
        <a href="business.dc.html#engineering" style="{{ mobileSubLinkStyle }}">Engineering</a>
        <a href="business.dc.html#technology" style="{{ mobileSubLinkStyle }}">Information Technology</a>
        <a href="business.dc.html#hospitality" style="{{ mobileSubLinkStyle }}">Hospitality</a>
      </div>
    </div>
    <a href="leadership.dc.html" style="{{ mobileLinkStyle }}">Leadership</a>
    <a href="contact.dc.html" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#0F141E;color:#FFFFFF;font-weight:700;font-size:16px;padding:14px;border-radius:100px;margin-top:10px;">Contact Us</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;business&quot;,&quot;leadership&quot;,&quot;contact&quot;]}}">

class Component extends DCLogic {
  state = { isMobile: (typeof window !== 'undefined' && window.innerWidth < 900), mobileOpen: false, bizOpen: false, bizOpenMobile: false };

  componentDidMount() {
    this.onResize = () => this.setState({ isMobile: window.innerWidth < 900 });
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
  }

  renderVals() {
    const active = this.props.active || '';
    const s = this.state;

    const navLink = (key) => `color:${active === key ? '#0F141E' : 'rgba(15,20,30,0.62)'};font-weight:${active === key ? '700' : '500'};font-size:15px;letter-spacing:0.01em;font-family:'Plus Jakarta Sans',sans-serif;transition:color 0.2s ease;padding:6px 2px;position:relative;`;

    const barStyle = (n) => `display:block;width:18px;height:2px;background:#0F141E;border-radius:2px;transition:transform 0.3s ease,opacity 0.3s ease;position:absolute;top:${9 + (n - 2) * 5}px;left:9px;transform:${
      s.mobileOpen && n === 1 ? 'translateY(5px) rotate(45deg)' :
      s.mobileOpen && n === 3 ? 'translateY(-5px) rotate(-45deg)' : 'none'
    };opacity:${s.mobileOpen && n === 2 ? 0 : 1};`;

    return {
      desktopNavStyle: `display:${s.isMobile ? 'none' : 'flex'};align-items:center;gap:32px;`,
      ctaDisplayStyle: `display:${s.isMobile ? 'none' : 'inline-flex'};`,
      hamburgerBtnStyle: `display:${s.isMobile ? 'block' : 'none'};position:relative;background:rgba(15,20,30,0.06);border:1px solid rgba(15,20,30,0.1);border-radius:50%;cursor:pointer;padding:0;flex-shrink:0;width:36px;height:36px;`,
      barStyle,
      navLinkStyle_about: navLink('about'),
      navLinkStyle_business: navLink('business'),
      navLinkStyle_leadership: navLink('leadership'),
      openBiz: () => !s.isMobile && this.setState({ bizOpen: true }),
      closeBiz: () => this.setState({ bizOpen: false }),
      bizArrowRotate: s.bizOpen ? 'rotate(180deg)' : 'rotate(0deg)',
      bizDropdownStyle: `position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%) translateY(${s.bizOpen ? '0' : '-8px'});opacity:${s.bizOpen ? 1 : 0};visibility:${s.bizOpen ? 'visible' : 'hidden'};pointer-events:${s.bizOpen ? 'auto' : 'none'};background:#FFFFFF;border:1px solid rgba(16,17,20,0.08);border-radius:18px;box-shadow:0 24px 60px rgba(16,17,20,0.22);padding:8px;min-width:260px;transition:opacity 0.25s ease,transform 0.25s ease,visibility 0.25s;display:flex;flex-direction:column;gap:3px;`,
      bizItemStyle: `display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#101114;font-size:15px;text-align:left;white-space:nowrap;transition:background 0.2s ease,color 0.2s ease;`,
      bizDotStyle: (color) => `width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;box-shadow:0 0 0 3px rgba(0,0,0,0.04);`,
      toggleMobile: () => this.setState({ mobileOpen: !s.mobileOpen }),
      toggleBizMobile: () => this.setState({ bizOpenMobile: !s.bizOpenMobile }),
      bizArrowRotateMobile: s.bizOpenMobile ? 'rotate(180deg)' : 'rotate(0deg)',
      mobilePanelStyle: `display:${s.isMobile ? 'flex' : 'none'};flex-direction:column;gap:2px;max-height:${s.mobileOpen ? '600px' : '0'};overflow:hidden;margin-top:${s.mobileOpen ? '10px' : '0'};padding:${s.mobileOpen ? '12px 20px 20px' : '0 20px'};transition:max-height 0.35s ease,padding 0.35s ease,margin 0.35s ease;background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);border:1px solid rgba(16,17,20,0.08);border-radius:24px;box-shadow:0 24px 60px rgba(16,17,20,0.16);`,
      mobileLinkStyle: `padding:14px 4px;font-size:16px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;color:#0F141E;border-bottom:1px solid rgba(16,17,20,0.08);`,
      bizMobilePanelStyle: `display:flex;flex-direction:column;max-height:${s.bizOpenMobile ? '220px' : '0'};overflow:hidden;transition:max-height 0.3s ease;padding-left:14px;`,
      mobileSubLinkStyle: `padding:11px 4px;font-size:15px;font-weight:500;color:rgba(15,20,30,0.62);`,
    };
  }
}

</script>
</body>
</html>
